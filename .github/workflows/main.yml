name: Build + Test

on: [push, pull_request]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - run: zip -r proselint.zip proselint -x "*.DS_Store"

      - name: Upload style to release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: proselint.zip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vale
        env:
          VALE_VERSION: 3.28.1
        run: |
          curl -sL --fail -o vale.tar.gz \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf vale.tar.gz -C "$RUNNER_TEMP/bin" vale
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The original proselint, which test.sh holds the style against.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
        working-directory: script

      - run: ./test.sh
